name: CI/CD Pipeline

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    uses: rebels-software/github-actions/.github/workflows/build-and-test.yaml@v1.0.0
    with:
      csproj-path: src/Rebels.Temporal/Rebels.Temporal.csproj
    secrets:
      CODE_COV_TOKEN: ${{ secrets.CODE_COV_TOKEN }}

  create-tag:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-and-test]
    uses: rebels-software/github-actions/.github/workflows/create-version-tag.yaml@v1.0.0
    with:
      csproj-path: src/Rebels.Temporal/Rebels.Temporal.csproj

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test]
    uses: rebels-software/github-actions/.github/workflows/publish-nuget.yaml@v1.0.0
    with:
      csproj-path: src/Rebels.Temporal/Rebels.Temporal.csproj
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
